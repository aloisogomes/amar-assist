name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Executar testes no Docker
        run: sh docker/ci.sh
